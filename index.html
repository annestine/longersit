<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Long Sit Club</title>
<style>
  :root{
    --bg:#EDF1F6; --card:#FFFFFF; --ink:#2A3441; --muted:#6B7887;
    --primary:#56789E; --primary-deep:#3E5C7E; --primary-soft:#DCE6F0;
    --rose:#C4849C; --rose-soft:#F3E4EA; --teal:#6E9B8E; --teal-soft:#E2EEEA;
    --gold:#C9A96A;
    --line:#DBE2EC;
    --shadow:0 1px 3px rgba(42,52,65,.07),0 6px 20px rgba(42,52,65,.05);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:40px}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px}

  header{padding:26px 4px 10px}
  .brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--primary-deep);font-weight:700}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .datebar{color:var(--muted);font-size:14px;margin-top:2px}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .card h2{font-size:15px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}

  .tipcard{background:linear-gradient(135deg,#F6F1E7,#F3E4EA);border-left:5px solid var(--gold);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px 18px 16px;margin-bottom:16px}
  .tiplabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:800}
  .tiptext{font-size:17px;font-weight:700;margin-top:6px;line-height:1.45}

  .step{padding:12px 0;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:none;padding-bottom:4px}
  .steprow{display:flex;align-items:center;gap:12px}
  .scheck{width:26px;height:26px;min-width:26px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;cursor:pointer;transition:all .2s}
  .step.done .scheck{background:var(--teal);border-color:var(--teal)}
  .step.done .sn{color:var(--muted);text-decoration:line-through}
  .sn{font-weight:600;font-size:15px;flex:1}
  .sside{font-size:12px;color:var(--rose);font-weight:700}
  .sdur{font-size:13px;color:var(--muted);white-space:nowrap}
  .qbtn{background:var(--primary-soft);color:var(--primary-deep);border:none;border-radius:9px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;font-variant-numeric:tabular-nums}
  .qbtn.running{background:var(--primary);color:#fff}
  .infoT{background:none;color:var(--muted);width:24px;height:24px;min-width:24px;border-radius:50%;border:1.5px solid var(--line);font-size:12px;cursor:pointer;font-weight:700}
  .sdesc{font-size:13px;color:var(--muted);margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:10px;display:none}
  .step.open .sdesc{display:block}
  .fixedtag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .rotatetag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--rose);font-weight:700}
  .alldone{color:var(--teal);font-weight:700;font-size:13px}

  .rbtn{width:100%;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:14px;margin-top:10px;cursor:pointer;font-family:inherit;transition:all .15s}
  .rbtn:active{transform:scale(.985)}
  .rbtn .rn{font-weight:700;font-size:15px;color:var(--ink)}
  .rbtn .rd{font-size:13px;color:var(--muted);margin-top:2px}
  .rbtn .rt{font-size:12px;color:var(--primary-deep);font-weight:700;margin-top:4px}
  .rbtn.mini{border:2px dashed var(--line);background:var(--card)}
  .rbtn.completed{background:var(--teal-soft);border-color:var(--teal)}
  .rbtn .rdone{float:right;color:var(--teal);font-weight:800;font-size:13px}

  .sessHead{display:flex;align-items:center;gap:10px;padding:22px 4px 12px}
  .back{background:var(--card);border:none;width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
  .sessHead h1{font-size:20px}
  .modetog{display:flex;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
  .modetog button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;font-family:inherit}
  .modetog button.on{background:var(--primary);color:#fff}

  .bigbtn{width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:6px;transition:transform .1s}
  .bigbtn:active{transform:scale(.985)}
  .bigbtn.primary{background:var(--primary);color:#fff}
  .bigbtn.teal{background:var(--teal);color:#fff}
  .bigbtn.ghost{background:var(--card);color:var(--muted);box-shadow:var(--shadow)}

  .guided{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding:20px 16px 26px;max-width:480px;margin:0 auto}
  .gtop{display:flex;justify-content:space-between;align-items:center}
  .gprog{font-size:13px;color:var(--muted);font-weight:600}
  .gexit{background:var(--card);border:none;border-radius:10px;padding:8px 14px;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:var(--shadow)}
  .gcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .gname{font-size:23px;font-weight:800;letter-spacing:-.01em;padding:0 10px}
  .gside{font-size:15px;color:var(--rose);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
  .gwrapring{position:relative;width:230px;height:230px;margin:26px 0}
  .gwrapring svg{transform:rotate(-90deg)}
  .gtime{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gtime .t{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .gtime .u{font-size:13px;color:var(--muted)}
  .grepbox{margin:26px 0;background:var(--card);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow)}
  .grepbox .r{font-size:26px;font-weight:800;color:var(--primary-deep)}
  .gnext{font-size:14px;color:var(--muted)}
  .gnext b{color:var(--ink)}
  .gdesc{font-size:13px;color:var(--muted);margin-top:12px;padding:0 8px;max-height:110px;overflow-y:auto}
  .gbtns{display:flex;gap:10px}
  .gbtns .bigbtn{margin-top:0}
  .flash{animation:flashbg .6s ease 2}
  @keyframes flashbg{0%,100%{background:var(--bg)}50%{background:var(--rose-soft)}}
  .resting .gname{color:var(--teal)}

  .celebrate{text-align:center;padding:40px 10px}
  .celebrate .big{font-size:54px}
  .celebrate h2{font-size:22px;margin-top:8px}
  .celebrate p{color:var(--muted);margin-top:6px;font-size:14px}

  .tabs{margin:4px 0 16px}
  .exname{font-weight:700;font-size:16px}
  .exhead{display:flex;align-items:flex-start;gap:10px}
  .extarget{font-size:13px;color:var(--primary-deep);font-weight:700;margin-top:2px}
  .exhead .infoT{margin-left:auto}
  .card.exc.open .sdesc{display:block}
  .card.exc{padding:16px 18px}
  .weektag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--rose);font-weight:800;background:var(--rose-soft);border-radius:6px;padding:2px 6px;margin-top:4px}
  .setrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
  .setrow:first-of-type{margin-top:10px}
  .setrow.done .scheck{background:var(--teal);border-color:var(--teal)}
  .setrow.done .setlbl{color:var(--muted);text-decoration:line-through}
  .setlbl{flex:1;font-size:14px;font-weight:600}
  .restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 32px);max-width:448px;background:var(--primary-deep);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(42,52,65,.25);z-index:40}
  .restbar .rlab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:700}
  .restbar .rtime{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .restbar .rnext{flex:1;font-size:13px;opacity:.9}
  .restbar button{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:800;font-family:inherit;cursor:pointer}
  .padbottom{height:90px}
  .switchwrap{position:absolute;left:-9999px;top:-9999px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
  button:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<label class="switchwrap" id="hapticLabel"><input type="checkbox" switch id="hapticSwitch"></label>

<script>
/* ============ DAILY TIPS ============ */
const TIPS = [
  "Alternate which leg you cross today — every time you notice, swap. Same comfort, half the asymmetry.",
  "Crafting or handwork today? Bring the work up to you, not your head down to the work. Elbows supported helps.",
  "Carrying a bag today? Switch shoulders halfway, or use both straps. Uneven loads feed the right side.",
  "Any position is fine — the same position for an hour isn't. Change something whenever you notice.",
  "Symmetry snack: ten seconds evenly on both sit bones, then go back to comfy. A few times today.",
  "Kettle boiling? That's a free calf-raise window.",
  "Every time you refill water today, roll your shoulders backward three times.",
  "Lean on the other armrest today. Whichever one you always use — the other one.",
  "Sitting down for a long focused session? Stand and shake it out once mid-way — tie it to something natural, like finishing a section or a row.",
  "Walk to the furthest toilet today. Small detours count.",
  "Notice your jaw right now. Unclench it. Repeat whenever you think of it today.",
  "Standing in a queue? Weight on one leg, 20 seconds, then the other.",
  "Shoulders creeping toward your ears while you focus? Exhale and let them drop. Check three times today.",
  "Doorways are free hip openers — one slightly longer step through, feel the front of the hip.",
  "If you sit with legs up today (fine!), swap which leg is on top now and then.",
  "Put something you need often — your water glass, your scissors — slightly out of reach today.",
  "Right side feeling tight? Ten slow neck half-circles, chin down, ear to each shoulder. No full backward circles.",
  "After a long sit, stand and reach both arms overhead for three breaths before walking off.",
  "Heavy shopping? Split it between both hands instead of one strong side. The right side always volunteers — decline.",
  "While the tea steeps: hands behind back, clasp, gently draw shoulders back for five breaths.",
  "Right now: sit or stand tall, interlace your fingers, push palms up toward the ceiling and stretch as tall as you can for three slow breaths.",
  "When you surface from a hyperfocus session, stretch before you start the next thing. Make surfacing the trigger.",
  "Stairs today? Full foot on the step, push through the heel. Free glute work.",
  "Right now: stand up, reach overhead, lean gently left then right. Ten seconds. Done — tip complete.",
  "Squeeze your glutes for five seconds. Nobody can tell. Do it a few times today when you remember."
];

/* ============ EXERCISE DESCRIPTIONS ============ */
const DESC = {
  catcow:'On all fours, hands under shoulders, knees under hips. Inhale: belly drops, lower back arches gently, gaze forward. Exhale: round the whole spine up, tuck the tailbone, let the head drop. Flow with the breath — no pausing at either end.',
  ham:'Lie on your back, strap around the ball of the foot, foot flexed (toes toward your face). Raise the leg until you feel the back of the thigh — knee as straight as comfortable. Other leg presses flat into the floor. Hold still; ease deeper only on exhales.',
  fold:'Sit on the floor, legs out in front. Sit tall first, then hinge from the hips — not the waist. Hands rest where they land, no pulling. You have earned the propless version — if a flare day makes it hard, a folded blanket is always allowed back.',
  butterfly:'Sit tall, soles of the feet together, knees falling out to the sides. Hold the ankles (not the toes) and let gravity lower the knees — no pressing. To deepen: hinge slightly forward from the hips, back long.',
  fig4:'Lie on your back, feet on the wall, knees around 90°. Cross one ankle over the other knee, foot flexed. Shuffle closer to the wall to deepen, away to ease. No pulling — the wall does the work.',
  calfA:'Face a wall, one foot stepped back, heel flat, back knee straight. Lean in until the upper calf stretches. Right side: comfortable range only, never force the ankle.',
  calfB:'Same position, but bend the back knee slightly, heel flat. The stretch moves lower, toward the Achilles.',
  sidebend:'Sit or stand. Reach one arm overhead and lean directly sideways away from that arm. Long stretch from hip to lower ribs — the QL area, right where the mid-back ache lives.',
  openbook:'Lie on your side, knees bent 90°, arms stacked in front. Sweep the top arm up and across like opening a book, following with your eyes. Slow — one breath per rep.',
  tilts:'Lie on your back, knees bent. Gently flatten the lower back into the floor, hold 5 seconds, release. Wakes the deep stabilisers without loading anything irritated.',
  hipstand:'Standing lunge: one foot forward, back leg straight — the straight back knee is what makes it work. Tailbone gently tucked, then push the hips forward until the front of the back hip stretches. A wall or desk for balance. 7/10 intensity.',
  /* morning */
  armcircles:'Stand relaxed. 10 slow backward arm circles, then 10 forward. Big and lazy, not fast — you are oiling the shoulders, not exercising.',
  reach:'Stand, feet hip-width. Reach both arms overhead, stretch tall, then lean gently to the left for a breath, back to centre, then right. Slow.',
  necktilts:'Stand or sit. Ear toward shoulder, hold two breaths, other side. Then chin toward chest, two breaths. Then slowly turn to look over each shoulder. Extra gentle and unhurried on the right.',
  standfold:'Feet hip-width, knees softly bent. Fold forward and just hang — arms heavy, head heavy, no reaching for the floor. Bend the knees as much as you like. Roll up slowly, one vertebra at a time.',
  crossbody:'Each arm, two positions. 1) Pull the arm straight across your chest with the other hand, shoulder down — feel the back of the shoulder. 2) Reach the same arm overhead, bend the elbow so the hand drops behind your neck, other hand gently assists at the elbow — feel the top of the arm. ~15 sec per position. The tight right side gets the same time, not more force.',
  balance:'Stand on one leg, 30 sec, then switch. Near a wall if needed. Harder: slow head turns, or eyes closed briefly. The right ankle gets a daily workout — that is the point.',
  /* breaks */
  eagle:'Wrap one arm under the other, elbows stacked, backs of hands (or palms) together. Now lift the elbows slightly and push them gently forward — the stretch lands right between and behind the shoulder blades. ~20 sec, then swap which arm is on top.',
  blades:'Standing or seated. Squeeze the shoulder blades together and slightly down — imagine holding a pencil between them — hold 5 sec, release. Repeat 5–6 times. Aim the squeeze at that spot beside the right shoulder blade.',
  neckR:'Right hand behind your back (or holding the chair seat). Tilt your left ear toward your left shoulder until the right side of the neck stretches. Add a slight downward gaze to move it. Gentle — 7/10 max.',
  twist:'Seated or standing: rotate the whole upper body to one side, using the chair back or a doorframe for a gentle hold. Two breaths each side.',
  trap:'Seated or standing. Right hand reaches down and slightly behind. Tilt head left and slightly forward until the top of the right shoulder stretches. Two slow breaths, then swap.',
  chestdoor:'Forearm on a doorframe, elbow at shoulder height. Step through gently until the chest and front of the shoulder open. 20 sec each side.',
  /* sciatica routine */
  rocking:'Lie on your back, hug both knees to your chest and rock gently side to side, massaging the lower back against the floor. Small, lazy movements.',
  lyingtwist:'Lie on your back, arms out in a T. Drop both bent knees to one side, head turning the other way. Shoulders stay heavy on the floor. Let gravity hold it — no forcing the knees down.',
  glides:'Lie on your back, hands behind one thigh, hip and knee at 90°. Slowly straighten the knee toward the ceiling until a gentle pull, then bend it back. Keep moving — this is the one exercise where you do NOT hold. 10 smooth, painless glides per side. If anything tingles or shoots, make the movement smaller.',
  /* back & neck routine */
  childside:'Kneel, sit back toward the heels, arms walked forward on the floor. Then walk both hands over to the left until the right side of the torso stretches, breathe there, and switch. A cushion under the hips if the knees complain.',
  needle:'On all fours. Slide the right arm under the left, palm up, until the right shoulder and ear rest toward the floor. The upper back rotates — breathe into the spot between the shoulder blades. Then the other side.',
  levator:'Sit or stand. Turn your head 45° to the left, then look down toward your left armpit. The left hand can rest gently on the back of the head — weight only, no pulling. This finds the stubborn spot where the right neck meets the shoulder blade. Then the other side.'
};

/* ============ STEP BUILDERS ============ */
const T =(name,side,secs,desc,group)=>({kind:'timed',name,side,secs,desc,group});
const R =(name,label,desc)=>({kind:'reps',name,label,desc,group:name});

/* Morning (~5 min, standing, easy) */
const MORNING = [
  R('Arm circles','10 back + 10 forward',DESC.armcircles),
  T('Overhead reach + side lean',null,30,DESC.reach,'m2'),
  T('Neck tilts + rotations',null,45,DESC.necktilts,'m3'),
  T('Standing forward fold, knees soft',null,60,DESC.standfold,'m4'),
  T('Shoulder stretch: cross-body + overhead',null,60,DESC.crossbody,'m5'),
  T('Single-leg balance','30 sec per side',60,DESC.balance,'m6'),
];

/* Breaks: 2 fixed + rotating pool */
const BREAK_FIXED = [
  {name:'Eagle arms',secs:45,desc:DESC.eagle},
  {name:'Shoulder blade squeezes',secs:45,desc:DESC.blades},
];
const BREAK_POOL = [
  {name:'Right-side neck stretch',secs:45,desc:DESC.neckR},
  {name:'Standing hip flexor stretch',secs:45,desc:DESC.hipstand},
  {name:'Gentle spinal twist',secs:45,desc:DESC.twist},
  {name:'Trapezius stretch',secs:45,desc:DESC.trap},
  {name:'Doorframe chest opener',secs:45,desc:DESC.chestdoor},
];

/* Stretch routines */
const ROUTINES = [
  {id:'mini',name:'Mini session',mini:true,desc:'For 1 am nights, low days, sick days. Something beats nothing — always.',
   steps:[
     T('Hamstring stretch, strap','Right',60,DESC.ham,'ham'),
     T('Hamstring stretch, strap','Left',60,DESC.ham,'ham'),
     T('Seated forward fold',null,90,DESC.fold,'fold'),
     T('Figure-four at wall','Right',90,DESC.fig4,'f4'),
   ]},
  {id:'sciatica',name:'Sciatica & glute relief',desc:'For the right glute / lower back. Gentle on hamstrings on purpose — nerves want calm, not aggressive stretching.',
   steps:[
     R('Cat-Cow','10–15 fluid reps',DESC.catcow),
     T('Knees-to-chest rocking',null,60,DESC.rocking,'rock'),
     T('Figure-four at wall','Right',120,DESC.fig4,'f4'),
     T('Figure-four at wall','Left',90,DESC.fig4,'f4'),
     T('Figure-four at wall','Right again',60,DESC.fig4,'f4'),
     T('Lying spinal twist','Knees to the left',60,DESC.lyingtwist,'lt'),
     T('Lying spinal twist','Knees to the right',60,DESC.lyingtwist,'lt'),
     R('Sciatic nerve glides','10 smooth glides per side',DESC.glides),
     T('Standing hip flexor','Right · back knee straight',90,DESC.hipstand,'hf'),
     T('Standing hip flexor','Left · back knee straight',90,DESC.hipstand,'hf'),
   ]},
  {id:'backneck',name:'Back & neck',desc:'Mid-back, upper back and the right-side neck. No hamstring block — add it yourself if you feel like it.',
   steps:[
     R('Cat-Cow','10–15 fluid reps',DESC.catcow),
     T('Child\u2019s pose with side reach','Hands walk left — stretch right',45,DESC.childside,'cp'),
     T('Child\u2019s pose with side reach','Hands walk right — stretch left',45,DESC.childside,'cp'),
     T('Thread the needle','Right arm under',45,DESC.needle,'tn'),
     T('Thread the needle','Left arm under',45,DESC.needle,'tn'),
     R('Open-book rotations','8–10 each side',DESC.openbook),
     T('Seated side bend (QL)','Lean left — stretch right',60,DESC.sidebend,'sb'),
     T('Seated side bend (QL)','Lean right — stretch left',60,DESC.sidebend,'sb'),
     T('Lying spinal twist','Knees to the left',60,DESC.lyingtwist,'lt'),
     T('Lying spinal twist','Knees to the right',60,DESC.lyingtwist,'lt'),
     T('Neck tilts + rotations',null,45,DESC.necktilts,'nt'),
     T('Levator scapulae stretch','Right side',30,DESC.levator,'lev'),
     T('Levator scapulae stretch','Left side',30,DESC.levator,'lev'),
   ]},
  {id:'r4',name:'Normal routine',desc:'The full maintenance session — floor work in one block, then standing.',
   steps:[
     R('Cat-Cow','10–15 fluid reps',DESC.catcow),
     T('Hamstring stretch, strap','Right · round 1',90,DESC.ham,'ham'),
     T('Hamstring stretch, strap','Left · round 1',90,DESC.ham,'ham'),
     T('Hamstring stretch, strap','Right · round 2',90,DESC.ham,'ham'),
     T('Hamstring stretch, strap','Left · round 2',90,DESC.ham,'ham'),
     T('Seated forward fold',null,120,DESC.fold,'fold'),
     T('Butterfly stretch',null,75,DESC.butterfly,'bf'),
     T('Figure-four at wall','Right · 2 min',120,DESC.fig4,'f4'),
     T('Figure-four at wall','Left · 2 min',120,DESC.fig4,'f4'),
     T('Figure-four at wall','Right · 1 min',60,DESC.fig4,'f4'),
     T('Figure-four at wall','Left · 1 min',60,DESC.fig4,'f4'),
     R('Pelvic tilts','10–15 slow reps',DESC.tilts),
     T('Standing hip flexor','Right · back knee straight',90,DESC.hipstand,'hf'),
     T('Standing hip flexor','Left · back knee straight',90,DESC.hipstand,'hf'),
     T('Calf stretch — straight knee','Right',60,DESC.calfA,'cA'),
     T('Calf stretch — straight knee','Left',60,DESC.calfA,'cA'),
     T('Calf stretch — bent knee','Right',60,DESC.calfB,'cB'),
     T('Calf stretch — bent knee','Left',60,DESC.calfB,'cB'),
   ]},
];

function estMinutes(steps){
  let s=0,reps=0;
  steps.forEach(st=>{ if(st.kind==='timed') s+=st.secs; else reps++; });
  s+=reps*75; s+=steps.length*9;
  return Math.round(s/60);
}

/* ============ DATE HELPERS & DAILY PICKS ============ */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daySeed(){
  const d=new Date();
  return d.getFullYear()*372 + (d.getMonth()+1)*31 + d.getDate();
}
function tipOfDay(){ return TIPS[ daySeed() % TIPS.length ]; }
function rotatingBreak(){ return BREAK_POOL[ daySeed() % BREAK_POOL.length ]; }

/* ============ TODAY-ONLY STATE ============ */
const LSKEY='longsit_today_v3';
let today = null;

function loadToday(){
  const t=todayStr();
  try{
    const raw=localStorage.getItem(LSKEY);
    if(raw){
      const s=JSON.parse(raw);
      if(s.date===t && Array.isArray(s.morning) && s.morning.length===MORNING.length
         && Array.isArray(s.breaks) && s.breaks.length===3){
        if(!Array.isArray(s.sessions)) s.sessions=[];
        if(!Array.isArray(s.strength)) s.strength=[];
        today=s; return;
      }
    }
  }catch(e){}
  today={date:t,morning:MORNING.map(()=>false),breaks:[false,false,false],sessions:[],strength:[]};
  saveToday();
}

  try{ localStorage.setItem(LSKEY,JSON.stringify(today)); }catch(e){}

/* ============ FEEDBACK: vibration + flash ============ */
function buzz(){
  try{
    if(navigator.vibrate){ navigator.vibrate(200); }
    else{
      const lbl=document.getElementById('hapticLabel');
      if(lbl) lbl.click();
    }
  }catch(e){}
  document.body.classList.add('flash');
  setTimeout(()=>document.body.classList.remove('flash'),1300);
}

window.toggleOpen=k=>{ view.open=(view.open===k?null:k); render(); };

window.rowCheck=(key,idx)=>{
  stopRowTimer(key+idx);
  if(key==='m'){ today.morning[idx]=!today.morning[idx]; }
  else if(key==='b'){ today.breaks[idx]=!today.breaks[idx]; }
  else if(key==='s'){ view.checked[idx]=!view.checked[idx]; }
  saveToday(); render();
};

function stopRowTimer(tk){
  if(timers[tk]){ clearInterval(timers[tk].interval); delete timers[tk]; }
}
function stopAllTimers(){ Object.keys(timers).forEach(stopRowTimer); }

window.rowTimer=(key,idx,secs)=>{
  const tk=key+idx;
  if(timers[tk]){ stopRowTimer(tk); render(); return; }
  stopAllTimers();
  timers[tk]={remaining:secs};
  timers[tk].interval=setInterval(()=>{
    if(!timers[tk]) return;
    timers[tk].remaining--;
    if(timers[tk].remaining<=0){
      stopRowTimer(tk);
      buzz();
      if(key==='m') today.morning[idx]=true;
      else if(key==='b') today.breaks[idx]=true;
      else if(key==='s') view.checked[idx]=true;
      saveToday();
    }
    render();
  },1000);
  render();
};

window.startRoutine=id=>{

};

window.setMode=m=>{
  stopAllTimers();
  view.mode=m;
  if(m==='guided') startGuided();
  else { if(guided&&guided.interval) clearInterval(guided.interval); guided=null; render(); }
};

function buildTimeline(steps){
  const tl=[];
  steps.forEach((s,i)=>{
    tl.push({...s,stepIndex:i});
    if(i<steps.length-1){
      const next=steps[i+1];
      const sameGroup=s.group && next.group===s.group;
      tl.push({kind:'rest',secs:sameGroup?5:10,label:sameGroup?'Switch sides':'Next exercise',next});
    }
  });
  return tl;
}
function startGuided(){
  const tl=buildTimeline(view.routine.steps);
  guided={tl,idx:0,remaining:null,paused:false,interval:null};
  if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});
  enterGuidedItem();
}
function enterGuidedItem(){
  if(guided.interval) clearInterval(guided.interval);
  const item=guided.tl[guided.idx];
  if(!item){ guidedComplete(); return; }
  if(item.kind==='reps'){ guided.remaining=null; renderGuided(); return; }
  guided.remaining=item.secs;
  renderGuided();
  guided.interval=setInterval(()=>{
    if(guided.paused) return;
    guided.remaining--;
    if(guided.remaining<=0){
      clearInterval(guided.interval);
      buzz();
      if(item.stepIndex!==undefined) view.checked[item.stepIndex]=true;
      guided.idx++; enterGuidedItem();
    } else { updateGuidedTime(); }
  },1000);
}
function guidedNext(){
  const item=guided.tl[guided.idx];
  if(guided.interval) clearInterval(guided.interval);
  if(item && item.stepIndex!==undefined) view.checked[item.stepIndex]=true;
  guided.idx++; enterGuidedItem();
}
function guidedComplete(){
  if(guided&&guided.interval) clearInterval(guided.interval);
  guided=null;
  view.routine.steps.forEach((_,i)=>view.checked[i]=true);
  finishSession();
}
function exitGuided(){
  if(guided&&guided.interval) clearInterval(guided.interval);
  guided=null; view.mode='manual'; render();
}
window.guidedNext=guidedNext; window.exitGuided=exitGuided;
window.guidedPause=()=>{ guided.paused=!guided.paused; renderGuided(); };

function renderGuided(){
  const item=guided.tl[guided.idx];
  if(!item) return;
  const stepsOnly=guided.tl.filter(t=>t.kind!=='rest');
  const stepNum=guided.tl.slice(0,guided.idx+1).filter(t=>t.kind!=='rest').length;
  const isRest=item.kind==='rest';
  const nextItem=isRest? item.next : guided.tl.slice(guided.idx+1).find(t=>t.kind!=='rest');

  let centre='';
  if(item.kind==='reps'){
    centre=`<div class="gname">${item.name}</div>
      <div class="grepbox"><div class="r">${item.label}</div></div>
      <div class="gdesc">${item.desc}</div>`;
  } else {
    const secs=item.secs, rem=guided.remaining!==null?guided.remaining:secs;
    const pct=1-rem/secs;
    const C=2*Math.PI*104;
    centre=`<div class="gname">${isRest?item.label:item.name}</div>
      ${item.side?`<div class="gside">${item.side}</div>`:''}
      <div class="gwrapring">
        <svg width="230" height="230" viewBox="0 0 230 230">
          <circle cx="115" cy="115" r="104" fill="none" stroke="var(--line)" stroke-width="10"/>
          <circle id="ring" cx="115" cy="115" r="104" fill="none" stroke="${isRest?'var(--teal)':'var(--primary)'}" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/>
        </svg>
        <div class="gtime"><div class="t" id="gtimeT">${fmt(rem)}</div><div class="u">${guided.paused?'paused':''}</div></div>
      </div>
      ${!isRest?`<div class="gdesc">${item.desc}</div>`:''}`;
  }

  app.innerHTML=`
  <div class="guided ${isRest?'resting':''}">
    <div class="gtop">
      <div class="gprog">${isRest?'':`Step ${stepNum} of ${stepsOnly.length}`}</div>
      <button class="gexit" onclick="exitGuided()">Exit guided</button>
    </div>
    <div class="gcenter">
      ${centre}
      ${nextItem?`<div class="gnext" style="margin-top:14px">Next: <b>${nextItem.name}${nextItem.side?' · '+nextItem.side:''}</b></div>`:''}
    </div>
    <div class="gbtns">
      ${item.kind!=='reps'?`<button class="bigbtn ghost" style="flex:1" onclick="guidedPause()">${guided.paused?'Resume':'Pause'}</button>`:''}
      <button class="bigbtn primary" style="flex:1" onclick="guidedNext()">${item.kind==='reps'?'Done →':'Skip →'}</button>
    </div>
  </div>`;
}
function updateGuidedTime(){
  const t=document.getElementById('gtimeT');
  const ring=document.getElementById('ring');
  const item=guided.tl[guided.idx];
  if(t) t.textContent=fmt(guided.remaining);
  if(ring && item.secs){
    const C=2*Math.PI*104;
    const pct=1-guided.remaining/item.secs;
    ring.style.strokeDashoffset=C*(1-pct);
  }
}

window.finishSession=()=>{
  stopAllTimers();
  if(view.routine && !today.sessions.includes(view.routine.id)){ today.sessions.push(view.routine.id); saveToday(); }
  view={name:'done'}; render();
};
window.exitSession=()=>{ stopAllTimers(); if(guided&&guided.interval) clearInterval(guided.interval); guided=null; view={name:'home'}; render(); };
window.goHome=()=>{ view={name:'home'}; render(); };

function strengthMinutes(r){
  let s=0;
  r.ex.forEach(e=>e.sets.forEach(st=>{
    s += st.secs ? st.secs : (/per side/.test(st.label)?55:35);
    if(!st.noRest) s += REST_SECS;
  }));
  s += r.ex.length*10;
  return Math.round(s/60);
}

      const c=view.checked[ei][si];
      const btn = st.secs ? `<button class="qbtn ${running?'running':''}" onclick="event.stopPropagation();strengthTimer(${ei},${si})">${running?fmt(running.remaining):'▶ '+fmt(st.secs)}</button>` : '';
      return `<div class="setrow ${c?'done':''}">
        <div class="scheck" onclick="setCheck(${ei},${si})">${c?'✓':''}</div>
        <div class="setlbl" onclick="setCheck(${ei},${si})">${st.label}</div>
        ${btn}
      </div>`;
    }).join('');
    return `<div class="card exc ${view.open===ei?'open':''}">
      <div class="exhead">
        <div>
          <div class="exname">${e.name}</div>
          <div class="extarget">${e.target}</div>
          ${e.tag?`<span class="weektag">${e.tag}</span>`:''}
        </div>
        <button class="infoT" onclick="toggleEx(${ei})">i</button>
      </div>
      <div class="sdesc">${e.desc}</div>
      ${sets}
    </div>`;
  }).join('');

  const required=r.ex.filter(e=>!e.optional);
  const allDone=r.ex.every((e,ei)=>e.optional || view.checked[ei].every(x=>x));

  const restHtml = rest ? `<div class="restbar">
      <div><div class="rlab">Rest</div><div class="rtime">${fmt(rest.remaining)}</div></div>
      <div class="rnext">${rest.next?'Next: <b>'+rest.next+'</b>':''}</div>
      <button onclick="skipRest()">Skip</button>
    </div>` : '';

  app.innerHTML=`
  <div class="sessHead">
    <button class="back" onclick="exitStrength()">←</button>
    <div><h1>${r.name}</h1><div class="sub">~${strengthMinutes(r)} min · tap a set when it's done</div></div>
  </div>
  ${cards}
  <button class="bigbtn ${allDone?'teal':'primary'}" onclick="finishStrength()">${allDone?'Done ✓':'Finish'}</button>
  <button class="bigbtn ghost" onclick="exitStrength()">Back</button>
  <div class="padbottom"></div>
  ${restHtml}`;
}

window.toggleEx=ei=>{ view.open=(view.open===ei?null:ei); render(); };

function nextSetLabel(ei,si){
  const r=view.routine;
  for(let e=ei;e<r.ex.length;e++){
    for(let s=(e===ei?si+1:0);s<r.ex[e].sets.length;s++){
      if(!view.checked[e][s]) return {name:r.ex[e].name, label:r.ex[e].sets[s].label};
    }
  }
  return null;
}

function startRest(ei,si){
  stopRest();
  const st=view.routine.ex[ei].sets[si];
  if(st.noRest) return;
  const nx=nextSetLabel(ei,si);
  if(!nx) return;
  rest={remaining:REST_SECS,next:nx.name};
  rest.interval=setInterval(()=>{
    if(!rest) return;
    rest.remaining--;
    if(rest.remaining<=0){ stopRest(); buzz(); }
    if(view.name==='strength') render();
  },1000);
}
window.skipRest=()=>{ stopRest(); render(); };

window.setCheck=(ei,si)=>{
  stopRowTimer('st'+ei+'_'+si);
  view.checked[ei][si]=!view.checked[ei][si];
  if(view.checked[ei][si]) startRest(ei,si); else stopRest();
  render();
};

window.strengthTimer=(ei,si)=>{
  const tk='st'+ei+'_'+si;
  if(timers[tk]){ stopRowTimer(tk); render(); return; }
  stopAllTimers(); stopRest();
  const st=view.routine.ex[ei].sets[si];
  timers[tk]={remaining:st.secs};
  timers[tk].interval=setInterval(()=>{
    if(!timers[tk]) return;
    timers[tk].remaining--;
    if(timers[tk].remaining<=0){
      stopRowTimer(tk);
      buzz();
      view.checked[ei][si]=true;
      startRest(ei,si);
    }
    render();
  },1000);
  render();
};

window.finishStrength=()=>{
  stopAllTimers(); stopRest();
  if(!today.strength.includes(view.routine.id)){ today.strength.push(view.routine.id); saveToday(); }
  view={name:'done',msg:'Strong back, strong shoulders. Good work.'}; render(); window.scrollTo(0,0);
};
window.exitStrength=()=>{ stopAllTimers(); stopRest(); view={name:'home'}; render(); window.scrollTo(0,0); };

/* ============ INIT ============ */
loadToday();
render();
setInterval(()=>{ if(today.date!==todayStr()){ loadToday(); if(view.name==='home') render(); } },60000);
</script>
</body>
</html>
